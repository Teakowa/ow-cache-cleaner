name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:REF_NAME) { throw "Tag $env:REF_NAME does not match Cargo version $version" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Publish the release
        shell: pwsh
        run: |
          Copy-Item target/release/ow-cache-cleaner.exe .
          $hash = (Get-FileHash ow-cache-cleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ow-cache-cleaner.exe" | Out-File -Encoding ascii ow-cache-cleaner.exe.sha256
          gh release create $env:REF_NAME ow-cache-cleaner.exe ow-cache-cleaner.exe.sha256 --generate-notes --title $env:REF_NAME
