name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Upload the exe and its checksum to the release
        shell: pwsh
        run: |
          Copy-Item target/release/ow-cache-cleaner.exe .
          $hash = (Get-FileHash ow-cache-cleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ow-cache-cleaner.exe" | Out-File -Encoding ascii ow-cache-cleaner.exe.sha256
          gh release upload $env:TAG ow-cache-cleaner.exe ow-cache-cleaner.exe.sha256 --clobber
